services:
  db:
    image: postgres:16-alpine
    container_name: pqr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pqr_db}
      POSTGRES_USER: ${POSTGRES_USER:-pqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pqr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pqr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pqr} -d ${POSTGRES_DB:-pqr_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqr-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,testserver}
      # Inside the compose network the host is `db`, not localhost
      DATABASE_URL: postgres://${POSTGRES_USER:-pqr}:${POSTGRES_PASSWORD:-pqr}@db:5432/${POSTGRES_DB:-pqr_db}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RUN_SEED: ${RUN_SEED:-True}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pqr_pgdata:
